name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deliberately light. Typecheck, lint, build — nothing that can go red for a
# reason unrelated to the change under review. A designer's first pull request
# failing on a flaky test teaches them the wrong lesson about this repo.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
